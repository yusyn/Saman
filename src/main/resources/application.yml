spring:
  application:
    name: saman
  main:
    headless: true
  datasource:
    url: jdbc:sqlite:${DB_PATH:CarRental.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-timeout: 30000
  jdbc:
    template:
      query-timeout: 30

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

saman:
  ui:
    enabled: ${SAMAN_UI_ENABLED:true}

fingerprint:
  host: ${FINGERPRINT_HOST:192.168.30.200}
  port: ${FINGERPRINT_PORT:4370}
  mock: ${FINGERPRINT_MOCK:false}
  connect-timeout-ms: ${FINGERPRINT_CONNECT_TIMEOUT_MS:8000}
  verify-timeout-seconds: ${FINGERPRINT_VERIFY_TIMEOUT_SECONDS:40}

logging:
  level:
    root: INFO
    com.car.rental: INFO
