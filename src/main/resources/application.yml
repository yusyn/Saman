spring:
  application:
    name: saman
  main:
    headless: true
  datasource:
    url: jdbc:sqlite:${DB_PATH:CarRental.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-timeout: 30000
  jdbc:
    template:
      query-timeout: 30

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        name: SAMANSESSION
        http-only: true
        # Set SAMAN_SESSION_SECURE=true behind HTTPS terminators
        secure: ${SAMAN_SESSION_SECURE:false}
        same-site: lax

# Initial admin bootstrap (only when AppUser table is empty). Prefer env vars:
#   SAMAN_ADMIN_USERNAME / SAMAN_ADMIN_PASSWORD
# Never commit real passwords. Password must be at least 8 characters.
saman:
  admin:
    username: ${SAMAN_ADMIN_USERNAME:}
    password: ${SAMAN_ADMIN_PASSWORD:}
  ui:
    enabled: true

fingerprint:
  host: ${FINGERPRINT_HOST:192.168.20.10}
  port: ${FINGERPRINT_PORT:4370}
  mock: ${FINGERPRINT_MOCK:false}
  connect-timeout-ms: ${FINGERPRINT_CONNECT_TIMEOUT_MS:2500}
  handshake-timeout-ms: ${FINGERPRINT_HANDSHAKE_TIMEOUT_MS:2500}
  gate-acquire-timeout-ms: ${FINGERPRINT_GATE_ACQUIRE_TIMEOUT_MS:3000}
  verify-timeout-seconds: ${FINGERPRINT_VERIFY_TIMEOUT_SECONDS:40}

logging:
  level:
    root: INFO
    com.car.rental: INFO
    org.springframework.security: INFO
